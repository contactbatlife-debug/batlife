    <!-- FAQ pour Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Comment prolonger la durée de vie de ma batterie de vélo électrique ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Restez entre 20% et 80% de charge, évitez les charges complètes prolongées, laissez refroidir la batterie 30 min avant de la charger, et stockez-la à 50% en hiver entre 15 et 20°C."
          }
        },
        {
          "@type": "Question",
          "name": "BatLife est-il gratuit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, BatLife est 100% gratuit, sans inscription ni publicité. Toutes les données sont stockées uniquement sur votre téléphone."
          }
        },
        {
          "@type": "Question",
          "name": "Comment hiverner une batterie de vélo électrique ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stockez votre batterie à environ 50% (entre 40% et 60%), dans un endroit sec et tempéré entre 15-20°C. Vérifiez le niveau tous les 2 mois."
          }
        },
        {
          "@type": "Question",
          "name": "Peut-on laisser une batterie de VAE en charge toute la nuit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ce n'est pas recommandé. Privilégiez une charge en votre présence et débranchez dès la cible atteinte. BatLife vous envoie une notification quand c'est le moment."
          }
        }
      ]
    }
    </script>
